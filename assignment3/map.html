<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Indonesian Map</title>
    <audio src="sounds/bg.mp3" class="bg-sound"></audio>
    <audio src="sounds/click.mp3" class="click-sound"></audio>
    <body background="images/bg-map-page.png" class="body homepage">
      <div class="map-body">
        <a href="index.html" class="logo"
          ><img src="images/logo-title.png"
        /></a>
        <!-- total 8 islands-->
        <div>
          <img
            src="images/sumatra.png"
            alt="sumatra-island"
            class="island sumatra"
            data-id="sumatra"
          />
          <img
            src="images/kalimantan.png"
            alt="kalimantan-island"
            class="island kalimantan"
            data-id="kalimantan"
          />
          <img
            src="images/sulawesi.png"
            alt="sulawesi-island"
            class="island sulawesi"
            data-id="sulawesi"
          />
          <img
            src="images/maluku.png"
            alt="maluku-island"
            class="island maluku"
            data-id="maluku"
          />

          <img
            src="images/papua.png"
            alt="papua-island"
            class="island papua"
            data-id="papua"
          />
          <img
            src="images/jawa.png"
            alt="jawa-island"
            class="island jawa"
            data-id="jawa"
          />
          <img
            src="images/bali.png"
            alt="bali-island"
            class="island bali"
            data-id="bali"
          />
          <img
            src="images/ntt.png"
            alt="ntt-island"
            class="island ntt"
            data-id="ntt"
          />
          <!-- pop up sections -->
          <div class="popup" id="popup">
            <button id="close-button">&times;</button>
            <img src="images/lake-toba.png" alt="lake-toba" id="popup-image" />
            <header id="popup-header">Sumatra Island</header>
            <div class="explanation" id="popup-text">
              Sumatra is home to Lake Toba, the largest volcanic lake in the
              world! It was formed by a supervolcanic eruption around 74,000
              years ago, one of the most powerful eruptions in Earth’s history
            </div>
            <div class="buttons">
              <!-- <button class="funfact button" id="funfacts">Fun fact</button>
              <button class="cities button" id="cities" data-id="sumatra">
                Cities
              </button> -->
            </div>
          </div>
        </div>
      </div>
      <footer>
        <img
          class="button"
          id="play"
          src="images/volume-on.png"
          alt="volume icon"
        />
        <a class="button" href="credit.html">Resources</a>
      </footer>
    </body>
  </head>
</html>
