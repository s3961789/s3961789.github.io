<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Indonesian Map</title>
    <body background="images/bg-map-page.png" class="body homepage">
      <div class="map-body">
        <img
          src="images/logo-title.png"
          alt="logo"
          class="logo"
          href="index.html"
        />
        <div>
          <img
            src="images/sumatra.png"
            alt="sumatra-island"
            class="island sumatra"
          />
          <img
            src="images/kalimantan.png"
            alt="kalimantan-island"
            class="island kalimantan"
          />
          <img
            src="images/sulawesi.png"
            alt="sulawesi-island"
            class="island sulawesi"
          />
          <img src="images/riau.png" alt="riau-island" class="island riau" />
          <img src="images/papua.png" alt="papua-island" class="island papua" />
          <img src="images/jawa.png" alt="jawa-island" class="island jawa" />
          <img src="images/bali.png" alt="bali-island" class="island bali" />
          <img src="images/ntt.png" alt="ntt-island" class="island ntt" />
          <div class="popup">
            <img src="images/lake-toba.png" alt="lake-toba" class="lake-toba" />
            <header>Sumatra Island</header>
            <div class="explanation">
              Sumatra is home to Lake Toba, the largest volcanic lake in the
              world! It was formed by a supervolcanic eruption around 74,000
              years ago, one of the most powerful eruptions in Earth’s history
            </div>
            <div>
              <button class="funfact button">Fun fact</button>
              <button class="cities button">Cities</button>
            </div>
          </div>
        </div>
      </div>
    </body>
  </head>
</html>
